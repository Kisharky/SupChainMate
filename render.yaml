# Render Blueprint — SupChainMate API  →  https://api.yuktiai.app
#
# Deploy: Render dashboard → New → Blueprint → pick this repo. Render reads this
# file, builds the FastAPI image, provisions Postgres for identity state, and
# wires the env vars. Then add the custom domain api.yuktiai.app to the service
# (Settings → Custom Domains) and point DNS at it (see DEPLOY.md).
#
# The apex yuktiai.app hosts the Yukti marketing site; SupChainMate is its
# flagship demo on a subdomain — frontend at app.yuktiai.app (Vercel), this API
# at api.yuktiai.app. See DEPLOY.md.

services:
  - type: web
    name: supchainmate-api
    runtime: docker
    dockerfilePath: logistics-ai-dashboard/Dockerfile
    dockerContext: logistics-ai-dashboard
    plan: free                       # upgrade to 'starter' for a persistent disk
    healthCheckPath: /api/health     # public (no auth) — Render probes this
    autoDeploy: true
    envVars:
      - key: AUTH_ENABLED
        value: "true"
      - key: FRONTEND_ORIGIN         # allows CORS from the Vercel frontend
        value: https://app.yuktiai.app
      - key: JWT_SECRET              # strong secret, generated & kept by Render
        generateValue: true
      - key: DATABASE_URL            # SQLite — zero to manage, nothing to expire.
        value: sqlite:///data/supchainmate_app.db
      # Demo login password (all six seeded roles). Change or remove before a
      # truly public launch; documented in DEPLOY.md.
      - key: DEMO_PASSWORD
        sync: false

    # Free tier: the instance sleeps after ~15 min idle (first hit wakes it in
    # ~30-60s) and the filesystem is ephemeral — demo users re-seed on boot, so
    # logins always work; uploads/brain memory reset on redeploy. To persist
    # everything + stop sleeping, upgrade to 'starter' and add a disk:
    # plan: starter
    # disk:
    #   name: scm-data
    #   mountPath: /var/data          # then set DATABASE_URL=sqlite:////var/data/app.db
    #   sizeGB: 1
    #
    # Prefer managed Postgres instead of SQLite? Add a `databases:` block and set
    # DATABASE_URL via fromDatabase — psycopg2 is already in requirements.
