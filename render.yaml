# Render Blueprint — SupChainMate API  →  https://api.yuktiai.app
#
# Deploy: Render dashboard → New → Blueprint → pick this repo. Render reads this
# file, builds the FastAPI image, provisions Postgres for identity state, and
# wires the env vars. Then add the custom domain api.yuktiai.app to the service
# (Settings → Custom Domains) and point DNS at it (see DEPLOY.md).
#
# The frontend is deployed separately on Vercel (yuktiai.app) — see DEPLOY.md.

services:
  - type: web
    name: supchainmate-api
    runtime: docker
    dockerfilePath: logistics-ai-dashboard/Dockerfile
    dockerContext: logistics-ai-dashboard
    plan: free                       # upgrade to 'starter' for a persistent disk
    healthCheckPath: /api/health     # public (no auth) — Render probes this
    autoDeploy: true
    envVars:
      - key: AUTH_ENABLED
        value: "true"
      - key: FRONTEND_ORIGIN         # allows CORS from the Vercel frontend
        value: https://yuktiai.app
      - key: JWT_SECRET              # strong secret, generated & kept by Render
        generateValue: true
      - key: DATABASE_URL            # identity state in managed Postgres
        fromDatabase:
          name: supchainmate-db
          property: connectionString
      # Demo login password (all six seeded roles). Change or remove before a
      # truly public launch; documented in DEPLOY.md.
      - key: DEMO_PASSWORD
        sync: false
      # --- Optional: persist Decision Brain + Data Hub uploads across deploys ---
      # Requires a paid instance with a disk (below). On free tier these live on
      # the ephemeral filesystem and reset on each redeploy (fine for a demo).
      # - key: DATA_HUB_DIR
      #   value: /var/data/data_hub

    # Uncomment on a paid plan to keep SQLite (brain/planner/data_hub) + uploads:
    # disk:
    #   name: scm-data
    #   mountPath: /var/data
    #   sizeGB: 1

databases:
  - name: supchainmate-db
    plan: free                       # free Postgres (note: 90-day expiry on free)
    databaseName: supchainmate
    ipAllowList: []                  # only reachable from Render's network
